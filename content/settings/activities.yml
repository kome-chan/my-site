items:
  - title: "交流"
    subtitle: "NETWORK"
    description: "横浜国立大学出身の起業家・大企業の経営者が集うネットワークを通じ、業界や世代を越えた出会いを生み出します。"
  - title: "成長"
    subtitle: "GROWTH"
    description: "上場経験を持つ先輩起業家によるメンターサポートや勉強会を通じ、実践的な知見を得ながら成長を後押しします。"
  - title: "支援"
    subtitle: "SUPPORT"
    description: "応援ファンドによる出資や、メンバー企業向けの優待制度を通じて、事業の実務的なバックアップを行います。"
